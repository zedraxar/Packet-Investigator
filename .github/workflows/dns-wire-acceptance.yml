name: DNS wire acceptance

on:
  pull_request:
    paths:
      - "tests/fixtures/dns_captures.py"
      - "tests/test_dns_end_to_end.py"
      - ".github/workflows/dns-wire-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TShark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run real-TShark DNS acceptance
        run: python -m pytest -q tests/test_dns_end_to_end.py
